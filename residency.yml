# residency.yml — what this repository asks of a host that mounts it.
#
# Drafted against library.anecdote.channel's RESIDENCY.md and modelled on
# proofing/residency.yml, which is the nearest precedent: a resident half written
# before any host binds it.
#
# THE NAME IS NOT DECLARED HERE. It comes from the mount path, so `.lockers-engine`
# at a host root IS the claim and nothing can disagree with it. `resident:` below is
# informational only.
#
# THE CLAIM IS A MENU, NOT A STARTUP SCRIPT. Nothing here starts because the
# repository was mounted. A host that never wants a catalogue kept fresh starts
# nothing and is never told off about it.
#
# NOTHING IS BOUND YET. No host mounts `.lockers-engine` today. This is written
# first on purpose — a claim is easier to argue with than an intention.
#
# ---------------------------------------------------------------------------
# THE ONE WAY THIS RESIDENT IS UNLIKE THE OTHERS: IT IS A TEMPLATE.
#
# stagecraft and proofing are each one repository in one place. The first line of
# this project's README tells you to copy it and be detached, "which you should
# consider a feature." So this file is copied too, and every copy is a SEPARATE
# resident with its own guilds, its own cursors and its own holdings.
#
# The mount path disambiguates one resident from another, which is exactly what it
# is for. What it does not do is disambiguate two copies on ONE host: both would
# want `.lockers-engine` and the second one silently loses. That is a real limit,
# it is not this file's to solve, and it is named here rather than discovered by
# whoever runs two lockers on one machine.
# ---------------------------------------------------------------------------

version: 1
resident: lockers           # informational; the mount path is what counts

# ---------------------------------------------------------------- storage --
#
# Labels, not locations. The host binds `label -> path` and may put them anywhere;
# this file never names a directory.
#
# The old bot's `refs` live in `_data/` and are COMMITTED, which is a binding this
# repository made for itself because there was nobody to ask. Knitted output goes
# wherever `bin/knit.mjs --out` says, and that folder is the owner's.

wants:
  - label: refs
    holds: >
      one owner's map: message ids per record, the work queue, and what is new
      or gone since the last knit
    lifecycle: durable
    disposition: public
    # It is also the bookmark. There used to be a `bookmarks` label here holding
    # per-channel read cursors for a bot; whatever a new harvest holds that refs
    # did not point at is new, so the cursors had nothing left to do.

  - label: holdings
    holds: >
      hard copies of the bytes themselves — the media, kept so the catalogue can
      claim to hold rather than only to point
    lifecycle: durable
    disposition: on-request
    # The pinning service is gone. `bin/knit.mjs --fetch` pulls an owner's own
    # attachments into their own output folder while the harvest's URLs are
    # fresh, so the copy lives with the person whose work it is. A host that
    # binds this label is holding that folder for them, not a catalogue of
    # everybody.

  - label: scratch
    holds: >
      in-flight state — partial fetches, pin accounting, logs; anything a re-run
      recreates
    lifecycle: transient
    disposition: private

# ------------------------------------------------------------------ peers --
# Per-verb, with `without:` finishing the sentence. A dependency of a verb is not
# a dependency of a product.
peers:
  - peer: bottles
    strength: optional
    for: [holdings]
    without: "a catalogue that points, and an offline cache that cannot be handed on"

  - peer: data-pile
    strength: optional
    for: [custody]
    without: >
      hard copies in a directory, which is fine until somebody asks you to prove
      when you had them

# --------------------------------------------------------------- services --
#
# None. There used to be two periodic services here, a bot sync and a CDN link
# refresh, and both existed to keep one process reading everyone's lockers and
# to keep its copies of their links alive. Knitting is something an owner does
# when they harvest themselves; a host has nothing to schedule on their behalf.

serves: []

# ------------------------------------------------------------------- gaps --
#
# 1. PAGES KNITTED WITHOUT --fetch POINT AT DISCORD'S SIGNED LINKS, and those die
#    24 hours after they were issued. Song links to other services do not. An
#    owner who publishes audio files should knit with --fetch; nothing here
#    forces it, and a host that binds `holdings` is the natural place to say so.
