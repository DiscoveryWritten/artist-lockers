name: Bot Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ARTIFACTS_DIR: ${{ github.workspace }}/_data
        run: uv run bin/cli.py sync

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet _data/ || \
          (git add _data/ && git commit -m "bot: sync $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" && git push)
